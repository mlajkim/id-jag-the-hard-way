apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          image: {{ .Values.image }}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: open-webui-data
              mountPath: /app/backend/data
          {{- if .Values.keycloak.enabled }}
          env:
            - name: ENABLE_OAUTH_SIGNUP
              value: "true"
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: keycloak-client-secret
                  key: client-id
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-client-secret
                  key: client-secret
            - name: OPENID_PROVIDER_URL
              value: "http://localhost:{{ .Values.keycloak.proxyPort }}/realms/{{ .Values.keycloak.realm }}/.well-known/openid-configuration"
            - name: OAUTH_PROVIDER_NAME
              value: "Keycloak"
            - name: OAUTH_SCOPES
              value: "openid email profile"
            - name: OPENID_REDIRECT_URI
              value: "http://localhost:{{ .Values.keycloak.redirectPort }}/oauth/oidc/callback"
          {{- end }}

        {{- if .Values.keycloak.enabled }}
        - name: keycloak-proxy
          image: alpine/socat
          command: ["socat"]
          args:
            - "tcp-listen:{{ .Values.keycloak.proxyPort }},fork,reuseaddr"
            - "tcp-connect:keycloak.idp:8080"
        {{- end }}

      volumes:
        - name: open-webui-data
          persistentVolumeClaim:
            claimName: open-webui-data-pvc
