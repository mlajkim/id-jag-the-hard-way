<svg xmlns="http://www.w3.org/2000/svg" width="1104" height="776" viewBox="0 0 1104 776" role="img" aria-labelledby="title desc"><title id="title">Runtime Proxy and MCP share an in-memory API token directory</title><desc id="desc">Inside one MCP pod, Runtime Proxy and the MCP server mount the same access-tokens emptyDir volume at /var/run/idthw-access-tokens. The volume uses memory. After a successful downstream token exchange, the proxy writes a request-specific API token file through its read-write mount, then sends its path in tools/call metadata. MCP reads the same file through its read-only mount. The pod setting fsGroup: 1000 provides shared group access. The proxy removes the file after the response.</desc><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="m2 1 6 4-6 4" fill="none" stroke="#537AC7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="m2 1 6 4-6 4" fill="none" stroke="#428B76" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="m2 1 6 4-6 4" fill="none" stroke="#C46864" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="m2 1 6 4-6 4" fill="none" stroke="#8B96AA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="m2 1 6 4-6 4" fill="none" stroke="#8770B1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><g id="access-token-key" transform="rotate(42 22 22)"><path d="M19 15h6v12h5v5h-5v8h-6Z" fill="currentColor"/><circle cx="22" cy="10" r="9" fill="currentColor"/><circle cx="22" cy="9" r="3.2" fill="white"/><path d="M16 8a6 6 0 0 1 9-3M20.5 20v15" fill="none" stroke="white" stroke-opacity=".48" stroke-width="1.4" stroke-linecap="round"/></g><filter id="card-shadow" x="-12%" y="-18%" width="124%" height="148%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#253B68" flood-opacity=".055"/></filter><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r=".7" fill="#C9D2E2" opacity=".38"/></pattern></defs><rect x=".5" y=".5" width="1103" height="775" rx="26" fill="#FDFEFF" stroke="#E7ECF4"/><rect x="20" y="20" width="1064" height="736" rx="18" fill="url(#grid)"/><g font-family="Avenir Next, Avenir, Segoe UI, Helvetica, Arial, sans-serif"><rect data-group="MCP POD" x="48" y="64" width="1008" height="648" rx="24" fill="#F1F3FA" fill-opacity=".8" stroke="#E1E5F0" stroke-width="1"/><text x="70" y="95" fill="#7A85A0" font-size="14" font-weight="600" text-anchor="start" letter-spacing="1.3">MCP POD</text><text x="1034" y="95" fill="#718096" font-size="14" font-weight="500" text-anchor="end">fsGroup: 1000</text><path d="M236 312 L236 564 L412 564" fill="none" stroke="#537AC7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><circle cx="236" cy="312" r="3" fill="white" stroke="#537AC7" stroke-width="1.5"/><path d="M376 212 L728 212" fill="none" stroke="#8770B1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/><circle cx="376" cy="212" r="3" fill="white" stroke="#8770B1" stroke-width="1.5"/><path d="M692 564 L868 564 L868 312" fill="none" stroke="#537AC7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><circle cx="692" cy="564" r="3" fill="white" stroke="#537AC7" stroke-width="1.5"/><g data-component="proxy"><rect x="96" y="112" width="280" height="200" rx="18" fill="white" stroke="#DEE4ED" stroke-width="1.2" filter="url(#card-shadow)"/><rect x="118" y="132" width="58" height="58" rx="16" fill="#E7F5F5"/><g transform="translate(127 141) scale(0.7692307692307693)" color="#287E8B"><path d="m26 2 20 7v16c0 12-10 20-20 26C16 45 6 37 6 25V9Z" fill="white" stroke="currentColor" stroke-width="2.2"/><path d="m26 9 13 5v12c0 8-6 14-13 19-7-5-13-11-13-19V14Z" fill="currentColor" opacity=".12"/><path d="m17 25 6 6 13-14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="264" y="141" width="92" height="25" rx="8" fill="#E7F5F5"/><text x="310" y="158" fill="#287E8B" font-size="13" font-weight="500" text-anchor="middle" font-family="Menlo, Consolas, monospace">container</text><text x="118" y="220" fill="#202B40" font-size="24" font-weight="600" text-anchor="start">MCP Runtime</text><text x="118" y="247" fill="#202B40" font-size="24" font-weight="600" text-anchor="start">Proxy</text><text x="118" y="292" fill="#718096" font-size="14" font-weight="500" text-anchor="start" font-family="Menlo, Consolas, monospace">auth-proxy</text></g><g data-component="mcp"><rect x="728" y="112" width="280" height="200" rx="18" fill="white" stroke="#DEE4ED" stroke-width="1.2" filter="url(#card-shadow)"/><rect x="750" y="132" width="58" height="58" rx="16" fill="#F0EDFA"/><g transform="translate(759 141) scale(0.7692307692307693)" color="#7361B2"><rect x="9" y="9" width="34" height="34" rx="10" fill="white" stroke="currentColor" stroke-width="2.2"/><path d="M18 1v8m16-8v8M18 43v8m16-8v8M1 18h8m-8 16h8m34-16h8m-8 16h8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><path d="m18 27 6-6a5 5 0 0 1 7 7l-5 5m8-7-6 6a5 5 0 0 1-7-7l5-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></g><rect x="896" y="141" width="92" height="25" rx="8" fill="#F0EDFA"/><text x="942" y="158" fill="#7361B2" font-size="13" font-weight="500" text-anchor="middle" font-family="Menlo, Consolas, monospace">container</text><text x="750" y="220" fill="#202B40" font-size="24" font-weight="600" text-anchor="start">MCP server</text><text x="750" y="292" fill="#718096" font-size="14" font-weight="500" text-anchor="start" font-family="Menlo, Consolas, monospace">idthw-demo-api-mcp</text></g><g data-component="volume"><rect x="412" y="464" width="280" height="200" rx="18" fill="white" stroke="#DEE4ED" stroke-width="1.2" filter="url(#card-shadow)"/><rect x="434" y="484" width="58" height="58" rx="16" fill="#F0F3F7"/><g transform="translate(443 493) scale(0.7692307692307693)" color="#718096"><path d="M10 3h22l12 12v34H10Z" fill="white" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M32 3v13h12M18 25h18m-18 8h18m-18 8h10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></g><rect x="604" y="493" width="68" height="25" rx="8" fill="#F0F3F7"/><text x="638" y="510" fill="#718096" font-size="13" font-weight="500" text-anchor="middle" font-family="Menlo, Consolas, monospace">Memory</text><text x="434" y="572" fill="#202B40" font-size="24" font-weight="600" text-anchor="start">Shared token files</text><text x="434" y="622" fill="#718096" font-size="14" font-weight="500" text-anchor="start" font-family="Menlo, Consolas, monospace">access-tokens · emptyDir</text><text x="434" y="644" fill="#718096" font-size="14" font-weight="500" text-anchor="start" font-family="Menlo, Consolas, monospace">/var/run/idthw-access-tokens</text></g><g><rect x="142.91" y="369" width="186.18" height="52" rx="9" fill="#FFFFFF" stroke="#E9EDF3" stroke-width=".9"/><text x="236" y="391" fill="#537AC7" font-size="17" font-weight="500" text-anchor="middle">1. Write API token</text><text x="236" y="412" fill="#718096" font-size="15" font-weight="500" text-anchor="middle" font-family="Menlo, Consolas, monospace">Read-write mount</text></g><g data-token-kind="exchanged" aria-label="Exchanged access token"><circle cx="236" cy="476" r="20" fill="#FDFEFF"/><use href="#access-token-key" transform="translate(217 457) scale(.86)" color="#6295C3"/></g><g><rect x="459" y="145" width="186" height="52" rx="9" fill="#FFFFFF" stroke="#E9EDF3" stroke-width=".9"/><text x="552" y="167" fill="#8770B1" font-size="17" font-weight="500" text-anchor="middle">2. tools/call</text><text x="552" y="188" fill="#718096" font-size="15" font-weight="500" text-anchor="middle" font-family="Menlo, Consolas, monospace">File path in _meta</text></g><g><rect x="779.415" y="369" width="177.17000000000002" height="52" rx="9" fill="#FFFFFF" stroke="#E9EDF3" stroke-width=".9"/><text x="868" y="391" fill="#537AC7" font-size="17" font-weight="500" text-anchor="middle">3. Read API token</text><text x="868" y="412" fill="#718096" font-size="15" font-weight="500" text-anchor="middle" font-family="Menlo, Consolas, monospace">Read-only mount</text></g><g data-token-kind="exchanged" aria-label="Exchanged access token"><circle cx="868" cy="476" r="20" fill="#FDFEFF"/><use href="#access-token-key" transform="translate(849 457) scale(.86)" color="#6295C3"/></g></g></svg>
