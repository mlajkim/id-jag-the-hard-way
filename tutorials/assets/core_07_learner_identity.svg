<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="744" viewBox="0 0 1000 744" role="img" aria-labelledby="title desc"><title id="title">Learner identity and protected API in separate Athenz domains</title><desc id="desc">Athenz is the Authorization Server. The human domain contains the new learner identity human.idjag-learner. The api domain contains the protected Resource Server api.idthw-api. The learner has not yet been granted the document-reading role.</desc><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="m2 1 6 4-6 4" fill="none" stroke="#537AC7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="m2 1 6 4-6 4" fill="none" stroke="#428B76" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="m2 1 6 4-6 4" fill="none" stroke="#C46864" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="m2 1 6 4-6 4" fill="none" stroke="#8B96AA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="m2 1 6 4-6 4" fill="none" stroke="#8770B1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><g id="access-token-key" transform="rotate(42 22 22)"><path d="M19 15h6v12h5v5h-5v8h-6Z" fill="currentColor"/><circle cx="22" cy="10" r="9" fill="currentColor"/><circle cx="22" cy="9" r="3.2" fill="white"/><path d="M16 8a6 6 0 0 1 9-3M20.5 20v15" fill="none" stroke="white" stroke-opacity=".48" stroke-width="1.4" stroke-linecap="round"/></g><filter id="card-shadow" x="-12%" y="-18%" width="124%" height="148%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#253B68" flood-opacity=".055"/></filter><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r=".7" fill="#C9D2E2" opacity=".38"/></pattern></defs><rect x=".5" y=".5" width="999" height="743" rx="26" fill="#FDFEFF" stroke="#E7ECF4"/><rect x="20" y="20" width="960" height="704" rx="18" fill="url(#grid)"/><g font-family="Avenir Next, Avenir, Segoe UI, Helvetica, Arial, sans-serif"><rect data-group="DOMAIN · human" x="64" y="400" width="376" height="296" rx="24" fill="#F1F3FA" fill-opacity=".8" stroke="#E1E5F0" stroke-width="1"/><text x="86" y="431" fill="#7A85A0" font-size="14" font-weight="600" text-anchor="start" letter-spacing="1.3">DOMAIN · human</text><rect data-group="DOMAIN · api" x="560" y="400" width="376" height="296" rx="24" fill="#F1F3FA" fill-opacity=".8" stroke="#E1E5F0" stroke-width="1"/><text x="582" y="431" fill="#7A85A0" font-size="14" font-weight="600" text-anchor="start" letter-spacing="1.3">DOMAIN · api</text><g data-component="as"><rect x="360" y="64" width="280" height="200" rx="18" fill="white" stroke="#DEE4ED" stroke-width="1.2" filter="url(#card-shadow)"/><rect x="382" y="84" width="58" height="58" rx="16" fill="#EEF0F8"/><g transform="translate(391 93) scale(0.7692307692307693)" color="#505D80"><path d="m26 1 22 12v26L26 51 4 39V13Z" fill="white" stroke="currentColor" stroke-width="2.2"/><path d="m26 9 15 8v17L26 43l-15-9V17Z" fill="currentColor" opacity=".13"/><rect x="18" y="23" width="16" height="14" rx="4" fill="currentColor"/><path d="M21 23v-5a5 5 0 0 1 10 0v5" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M26 28v4" stroke="white" stroke-width="2" stroke-linecap="round"/></g><text x="382" y="172" fill="#202B40" font-size="24" font-weight="600" text-anchor="start">Authorization</text><text x="382" y="199" fill="#202B40" font-size="24" font-weight="600" text-anchor="start">Server (AS)</text><text x="382" y="244" fill="#718096" font-size="14" font-weight="500" text-anchor="start" font-family="Menlo, Consolas, monospace">Athenz</text></g><g data-component="human"><rect x="112" y="448" width="280" height="200" rx="18" fill="white" stroke="#DEE4ED" stroke-width="1.2" filter="url(#card-shadow)"/><rect x="134" y="468" width="58" height="58" rx="16" fill="#F8EEE6"/><g transform="translate(143 477) scale(0.7692307692307693)" color="#A66D4C"><path d="M21 26a11 11 0 1 1 10 0c10 2 17 10 17 20v5H4v-5c0-10 7-18 17-20Z" fill="currentColor"/></g><text x="134" y="556" fill="#202B40" font-size="24" font-weight="600" text-anchor="start">Human</text><text x="134" y="628" fill="#718096" font-size="14" font-weight="500" text-anchor="start" font-family="Menlo, Consolas, monospace">human.idjag-learner</text></g><g data-component="api"><rect x="608" y="448" width="280" height="200" rx="18" fill="white" stroke="#DEE4ED" stroke-width="1.2" filter="url(#card-shadow)"/><rect x="630" y="468" width="58" height="58" rx="16" fill="#EAF5EF"/><g transform="translate(639 477) scale(0.7692307692307693)" color="#38836F"><rect x="11" y="2" width="36" height="40" rx="7" fill="currentColor" opacity=".12"/><rect x="5" y="10" width="36" height="40" rx="7" fill="white" stroke="currentColor" stroke-width="2.2"/><path d="m18 22-6 8 6 8m10-16 6 8-6 8" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="776" y="477" width="92" height="25" rx="8" fill="#EAF5EF"/><text x="822" y="494" fill="#38836F" font-size="13" font-weight="500" text-anchor="middle" font-family="Menlo, Consolas, monospace">protected</text><text x="630" y="556" fill="#202B40" font-size="24" font-weight="600" text-anchor="start">Resource Server</text><text x="630" y="