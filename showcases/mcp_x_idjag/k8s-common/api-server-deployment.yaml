apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: mcp-pattern-3a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
    spec:
      containers:
        - name: api-server
          image: ghcr.io/mlajkim/api-server:latest
          env:
            - name: AT_REQUIRED
              value: "true"
            - name: ATHENZ_DOMAIN
              value: "mcp.pattern3a"
          volumeMounts:
            - name: api-server-policies
              mountPath: /app/policies
              readOnly: true
        - name: zpu
          image: ghcr.io/mlajkim/zpu:latest
          imagePullPolicy: Always
          env:
            - name: ZPU_DOMAIN
              value: "mcp.pattern3a"
            - name: ZTS_URL
              value: "https://athenz-zts-server.athenz:4443/zts/v1"
            - name: ZPU_INTERVAL_SECONDS
              value: "5"
          volumeMounts:
            - name: api-server-policies
              mountPath: /policies
            - name: api-zpu-cert
              mountPath: /var/run/athenz/zpu
              readOnly: true
      volumes:
        - name: api-server-policies
          emptyDir: {}
        - name: api-zpu-cert
          secret:
            secretName: api-zpu-cert
            defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: api-server
  namespace: mcp-pattern-3a
spec:
  selector:
    app: api-server
  ports:
    - port: 8080
      targetPort: 8080
