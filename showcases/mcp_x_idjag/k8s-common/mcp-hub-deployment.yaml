apiVersion: v1
kind: ServiceAccount
metadata:
  name: hub-ui
  namespace: ${MCP_HUB_NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-hub-catalog-reader
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-hub-catalog-reader
subjects:
  - kind: ServiceAccount
    name: hub-ui
    namespace: ${MCP_HUB_NAMESPACE}
roleRef:
  kind: ClusterRole
  name: mcp-hub-catalog-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-hub
  namespace: ${MCP_HUB_NAMESPACE}
  labels:
    app: mcp-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-hub
  template:
    metadata:
      labels:
        app: mcp-hub
    spec:
      serviceAccountName: hub-ui
      securityContext:
        fsGroup: 1000
      volumes:
        - name: attestation-data
          projected:
            sources:
              - serviceAccountToken:
                  audience: https://kubernetes.default.svc
                  expirationSeconds: 3600
                  path: token
        - name: athenz-tls-certs
          emptyDir: {}
        - name: athenz-cacert
          secret:
            secretName: athenz-cacert
            defaultMode: 0555
            items:
              - key: ca.cert.pem
                path: ca-certificates.crt
      initContainers:
        - name: sia-init
          image: ghcr.io/ctyano/k8s-athenz-sia:latest
          imagePullPolicy: IfNotPresent
          args:
            - --mode=init
            - --delay-jitter-seconds=5
          envFrom:
            - configMapRef:
                name: mcp-hub-sia
          env: &sia-env
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
            - name: SERVICEACCOUNT
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.serviceAccountName
            - name: POD_UID
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.uid
            - name: POD_IP
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: status.podIP
          volumeMounts: &sia-volume-mounts
            - name: attestation-data
              mountPath: /var/run/secrets/kubernetes.io/bound-serviceaccount
              readOnly: true
            - name: athenz-tls-certs
              mountPath: /var/run/athenz
            - name: athenz-cacert
              mountPath: /etc/ssl/certs/ca-certificates.crt
              subPath: ca-certificates.crt
              readOnly: true
      containers:
        - name: sia
          image: ghcr.io/ctyano/k8s-athenz-sia:latest
          imagePullPolicy: IfNotPresent
          args:
            - --mode=refresh
          envFrom:
            - configMapRef:
                name: mcp-hub-sia
          env: *sia-env
          volumeMounts: *sia-volume-mounts
          resources:
            limits:
              cpu: 50m
              memory: 64Mi
        - name: mcp-hub
          image: mcp-hub:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3102
          env:
            - name: NODE_ENV
              value: production
            - name: HOSTNAME
              value: 0.0.0.0
            - name: PORT
              value: "3102"
            - name: AUTH_URL
              value: http://localhost:3102
            - name: AUTH_TRUST_HOST
              value: "true"
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: mcp-hub-config
                  key: auth-secret
            - name: MCP_HUB_IDP_NAME
              value: Keycloak
            - name: MCP_HUB_IDP_ISSUER
              value: http://localhost:34443/realms/master
            - name: MCP_HUB_IDP_PUBLIC_ISSUER
              value: http://localhost:34443/realms/master
            - name: MCP_HUB_IDP_WELL_KNOWN
              value: http://keycloak.idp:8080/realms/master/.well-known/openid-configuration
            - name: MCP_HUB_IDP_AUTHORIZATION_ENDPOINT
              value: http://localhost:34443/realms/master/protocol/openid-connect/auth
            - name: MCP_HUB_IDP_TOKEN_ENDPOINT
              value: http://keycloak.idp:8080/realms/master/protocol/openid-connect/token
            - name: MCP_HUB_IDP_END_SESSION_ENDPOINT
              value: http://localhost:34443/realms/master/protocol/openid-connect/logout
            - name: MCP_HUB_IDP_CLIENT_ID
              value: mcp-hub.hub-ui
            - name: MCP_HUB_IDP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mcp-hub-config
                  key: client-secret
            - name: MCP_HUB_ZTS_URL
              value: https://athenz-zts-server.athenz:4443/zts/v1
            - name: MCP_HUB_ZTS_AUDIENCE
              value: https://athenz-zts-server.athenz:4443/zts/v1
            - name: MCP_HUB_CERT_DIR
              value: /var/run/athenz
            - name: MCP_HUB_CONNECTOR_REPOSITORY_ROOT
              value: "${MCP_HUB_CONNECTOR_REPOSITORY_ROOT}"
            - name: MCP_HUB_ATHENZ_CERT_PATH
              value: /var/run/athenz/tls.crt
            - name: MCP_HUB_ATHENZ_KEY_PATH
              value: /var/run/athenz/tls.key
            - name: MCP_HUB_ATHENZ_CA_PATH
              value: /var/run/athenz/ca.crt
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/athenz/ca.crt
          volumeMounts:
            - name: athenz-tls-certs
              mountPath: /var/run/athenz
              readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-hub
  namespace: ${MCP_HUB_NAMESPACE}
  labels:
    app: mcp-hub
spec:
  selector:
    app: mcp-hub
  ports:
    - name: http
      port: 3102
      targetPort: http
