apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-sa
  namespace: ${PATTERN_NAMESPACE}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
  namespace: ${PATTERN_NAMESPACE}
  labels:
    app: mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp
  template:
    metadata:
      labels:
        app: mcp
    spec:
      serviceAccountName: mcp-sa
      securityContext:
        fsGroup: 1000
      volumes:
        - name: attestation-data
          projected:
            sources:
              - serviceAccountToken:
                  audience: https://kubernetes.default.svc
                  expirationSeconds: 3600
                  path: token
        - name: athenz-tls-certs
          emptyDir: {}
        - name: athenz-cacert
          secret:
            secretName: athenz-cacert
            defaultMode: 0555
            items:
              - key: ca.cert.pem
                path: ca-certificates.crt
      initContainers:
        - name: sia-init
          image: ghcr.io/ctyano/k8s-athenz-sia:latest
          imagePullPolicy: IfNotPresent
          args:
            - --mode=init
            - --delay-jitter-seconds=5
          envFrom:
            - configMapRef:
                name: mcp-sia
          env: &sia-env
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
            - name: SERVICEACCOUNT
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.serviceAccountName
            - name: POD_UID
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.uid
            - name: POD_IP
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: status.podIP
          volumeMounts: &sia-volumeMounts
            - name: attestation-data
              mountPath: /var/run/secrets/kubernetes.io/bound-serviceaccount
              readOnly: true
            - name: athenz-tls-certs
              mountPath: /var/run/athenz
            - name: athenz-cacert
              mountPath: /etc/ssl/certs/ca-certificates.crt
              subPath: ca-certificates.crt
              readOnly: true
      containers:
        - name: sia
          image: ghcr.io/ctyano/k8s-athenz-sia:latest
          imagePullPolicy: IfNotPresent
          args:
            - --mode=refresh
          envFrom:
            - configMapRef:
                name: mcp-sia
          env: *sia-env
          volumeMounts: *sia-volumeMounts
          resources:
            limits:
              cpu: 50m
              memory: 64Mi
        - name: simple-mcp-server
          image: simple-mcp-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: mcp
              containerPort: 8081
          env:
            - name: PORT
              value: "8081"
            - name: BACKEND_API_URL
              value: "http://api-server.${PATTERN_NAMESPACE}:8080"
            - name: BACKEND_API_PATH
              value: "/api/docs"
            - name: ZTS_URL
              value: "https://athenz-zts-server.athenz:4443/zts/v1"
            - name: BACKEND_SCOPE
              value: "${ATHENZ_DOMAIN}:role.docs-getter"
            - name: ATHENZ_CERT_FILE
              value: "/var/run/athenz/tls.crt"
            - name: ATHENZ_KEY_FILE
              value: "/var/run/athenz/tls.key"
            - name: ATHENZ_CA_FILE
              value: "/var/run/athenz/ca.crt"
          volumeMounts:
            - name: athenz-tls-certs
              mountPath: /var/run/athenz
              readOnly: true
        - name: mcp-reverse-proxy
          image: mcp-reverse-proxy:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: public
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: UPSTREAM_MCP_URL
              value: "http://localhost:8081"
            - name: ATHENZ_URL
              value: "https://athenz-zts-server.athenz:4443/zts/v1"
            - name: ATHENZ_DOMAIN
              value: "${ATHENZ_DOMAIN}"
            - name: MCP_RESOURCE
              value: "mcp"
            - name: MCP_ACTION
              value: "access"
            - name: PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: mcp-reverse-proxy-config
                  key: PUBLIC_BASE_URL
            - name: AS_ISSUER_URL
              valueFrom:
                configMapKeyRef:
                  name: mcp-reverse-proxy-config
                  key: AS_ISSUER_URL
            - name: ATHENZ_CA_FILE
              value: "/var/run/athenz/ca.crt"
          volumeMounts:
            - name: athenz-tls-certs
              mountPath: /var/run/athenz
              readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: mcp
  namespace: ${PATTERN_NAMESPACE}
spec:
  selector:
    app: mcp
  ports:
    - name: public
      port: 3000
      targetPort: public
