    authorization-path: ${KEYCLOAK_BROWSER_AUTH_URL:http://localhost:34443/realms/master/protocol/openid-connect/auth}
    token-path: ${KEYCLOAK_ISSUER_URL:http://localhost:34443/realms/master}/protocol/openid-connect/token
    jwks-path: ${KEYCLOAK_ISSUER_URL:http://localhost:34443/realms/master}/protocol/openid-connect/certs
    client-id: ${QUARKUS_OIDC_CLIENT_ID:pattern-3a-mop}
    credentials:
