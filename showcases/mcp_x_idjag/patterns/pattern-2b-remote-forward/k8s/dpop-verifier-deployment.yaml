apiVersion: apps/v1
kind: Deployment
metadata:
  name: dpop-verifier
  namespace: ${PATTERN_NAMESPACE}
  labels:
    app: dpop-verifier
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dpop-verifier
  template:
    metadata:
      labels:
        app: dpop-verifier
    spec:
      containers:
        - name: dpop-verifier
          image: dpop-verifier:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
            - name: grpc
              containerPort: 50051
          env:
            - name: KEYCLOAK_ISSUER
              value: "${KEYCLOAK_ISSUER}"
            - name: KEYCLOAK_JWKS_URL
              value: "http://keycloak.idp:8080/realms/master/protocol/openid-connect/certs"
            - name: KEYCLOAK_AUDIENCE
              value: "${KEYCLOAK_CLIENT_ID}"
            - name: DPOP_IAT_FRESHNESS_SECONDS
              value: "100"
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dpop-verifier
  namespace: ${PATTERN_NAMESPACE}
spec:
  selector:
    app: dpop-verifier
  ports:
    - name: http
      port: 8090
      targetPort: 8090
    - name: grpc
      port: 50051
      targetPort: 50051
