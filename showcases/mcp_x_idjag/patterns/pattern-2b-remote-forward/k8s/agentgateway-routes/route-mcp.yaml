apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp
  namespace: ${PATTERN_NAMESPACE}
spec:
  parentRefs:
    - name: pattern-2b-gateway
  hostnames:
    - "mcp.pattern-2b.localhost"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - name: mcp
          group: agentgateway.dev
          kind: AgentgatewayBackend
