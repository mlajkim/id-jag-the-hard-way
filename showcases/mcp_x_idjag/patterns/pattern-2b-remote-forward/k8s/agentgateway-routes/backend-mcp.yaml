# Targets mcp-reverse-proxy's port on the "mcp" Service bootstrap-common
# phase 7 already deploys (same Pod/Service pattern-3a's docs MCP uses).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: mcp
  namespace: ${PATTERN_NAMESPACE}
spec:
  mcp:
    targets:
      - name: docs
        static:
          host: mcp.${PATTERN_NAMESPACE}.svc.cluster.local
          port: 3000
          path: /mcp
          protocol: StreamableHTTP
