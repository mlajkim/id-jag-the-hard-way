apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo-mcp
  namespace: ${PATTERN_NAMESPACE}
spec:
  parentRefs:
    - name: pattern-3b-agentgateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /echo
      backendRefs:
        - name: echo-mcp
          group: agentgateway.dev
          kind: AgentgatewayBackend
