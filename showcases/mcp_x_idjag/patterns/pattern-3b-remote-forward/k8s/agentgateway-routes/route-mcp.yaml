# No hostname match: unlike Pattern 2b, the caller is always mcp-bff-gateway
# calling agentgateway's in-cluster Service directly (no developer-machine
# *.localhost DNS trick needed), so docs vs. echo is distinguished purely by
# path prefix.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp
  namespace: ${PATTERN_NAMESPACE}
spec:
  parentRefs:
    - name: pattern-3b-agentgateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /docs
      backendRefs:
        - name: mcp
          group: agentgateway.dev
          kind: AgentgatewayBackend
