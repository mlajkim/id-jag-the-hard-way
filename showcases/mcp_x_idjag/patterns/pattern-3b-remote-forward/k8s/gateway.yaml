# agentgateway (as documented) has no inbound/frontend mTLS client-certificate
# validation on a Gateway listener - only outbound/backend TLS is supported
# (BackendTLSPolicy / AgentgatewayPolicy.spec.backend.tls, see
# agentgateway-routes/policy-athenz-zts-tls.yaml). This listener is therefore
# plain HTTP, same as Pattern 2b's. The trust boundary that stands in for
# DPoP here is: (1) the NetworkPolicy in agentgateway-networkpolicy.yaml,
# which restricts inbound connections to only mcp-bff-gateway's pod, and
# (2) policy-jwt.yaml's audience check, which only accepts id_tokens issued
# for mcp-bff-gateway's own Keycloak client id.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: pattern-3b-agentgateway
  namespace: ${PATTERN_NAMESPACE}
spec:
  gatewayClassName: agentgateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
