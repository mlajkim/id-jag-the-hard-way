name: Build and Push IDTHW Demo API MCP

on:
  push:
    branches: [ "main" ]
    paths:
      - "components/idthw-demo-api-mcp/**"
      - ".github/workflows/publish-idthw-demo-api-mcp.yml"
      - ".github/workflows/build-multiarch-image.yml"
      - ".github/scripts/check-container.sh"
  pull_request:
    branches: [ "main" ]
    paths:
      - "components/idthw-demo-api-mcp/**"
      - ".github/workflows/publish-idthw-demo-api-mcp.yml"
      - ".github/workflows/build-multiarch-image.yml"
      - ".github/scripts/check-container.sh"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    uses: ./.github/workflows/build-multiarch-image.yml
    with:
      image: idthw-demo-api-mcp
      context: ./components/idthw-demo-api-mcp
      node-checks: npm run check && npm test && node --experimental-strip-types --test ../mcp-runtime-proxy/test/tutorial.test.ts
    secrets:
      DEPLOY_GHCR_SECRET: ${{ secrets.DEPLOY_GHCR_SECRET }}
