name: Build and Push API Server Image

on:
  push:
    branches: [ "main" ]
    paths:
      - "components/api_server/**"
      - ".github/workflows/publish-api-server.yml"
      - ".github/workflows/build-multiarch-image.yml"
      - ".github/scripts/check-container.sh"
      - "!components/api_server/authorization_proxy/**"
      - "!components/api_server/mcp/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "components/api_server/**"
      - ".github/workflows/publish-api-server.yml"
      - ".github/workflows/build-multiarch-image.yml"
      - ".github/scripts/check-container.sh"
      - "!components/api_server/authorization_proxy/**"
      - "!components/api_server/mcp/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    uses: ./.github/workflows/build-multiarch-image.yml
    with:
      image: api-server
      context: ./components/api_server
      java-build: |
        mvn -B test
    secrets:
      DEPLOY_GHCR_SECRET: ${{ secrets.DEPLOY_GHCR_SECRET }}
