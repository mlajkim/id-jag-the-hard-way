name: Build and Push IDTHW Demo API

on:
  push:
    branches: [ "main" ]
    paths:
      - "components/idthw-demo-api/**"
      - ".github/workflows/publish-idthw-demo-api.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "components/idthw-demo-api/**"
      - ".github/workflows/publish-idthw-demo-api.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: idthw-demo-api
  BUILD_DIR: ./components/idthw-demo-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: components/idthw-demo-api/package-lock.json

      - name: Install dependencies and run checks
        working-directory: ${{ env.BUILD_DIR }}
        run: npm ci --ignore-scripts && npm run check && npm test

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.DEPLOY_GHCR_SECRET || secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr,prefix=pr
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

      - name: Build and push the image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.BUILD_DIR }}
          file: ${{ env.BUILD_DIR }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
