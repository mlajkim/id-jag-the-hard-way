name: Build and Push IDTHW Demo API

on:
  push:
    branches: [ "main" ]
    paths:
      - "components/idthw-demo-api/**"
      - ".github/workflows/publish-idthw-demo-api.yml"
      - ".github/workflows/build-multiarch-image.yml"
      - ".github/scripts/check-container.sh"
  pull_request:
    branches: [ "main" ]
    paths:
      - "components/idthw-demo-api/**"
      - ".github/workflows/publish-idthw-demo-api.yml"
      - ".github/workflows/build-multiarch-image.yml"
      - ".github/scripts/check-container.sh"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    uses: ./.github/workflows/build-multiarch-image.yml
    with:
      image: idthw-demo-api
      context: ./components/idthw-demo-api
      node-checks: npm ci --ignore-scripts && npm run check && npm test
      publish-pr: false
    secrets:
      DEPLOY_GHCR_SECRET: ${{ secrets.DEPLOY_GHCR_SECRET }}
