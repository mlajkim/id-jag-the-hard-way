name: Build and Push MCP Server

on:
  push:
    branches: [ "main" ]
    paths:
      - "components/api_server/mcp/**"
      - ".github/workflows/publish-mcp.yml"
      - ".github/workflows/build-multiarch-image.yml"
      - ".github/scripts/check-container.sh"
  pull_request:
    branches: [ "main" ]
    paths:
      - "components/api_server/mcp/**"
      - ".github/workflows/publish-mcp.yml"
      - ".github/workflows/build-multiarch-image.yml"
      - ".github/scripts/check-container.sh"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    uses: ./.github/workflows/build-multiarch-image.yml
    with:
      image: mcp
      context: ./components/api_server/mcp
      node-checks: npm ci --no-audit --no-fund && npm test
    secrets:
      DEPLOY_GHCR_SECRET: ${{ secrets.DEPLOY_GHCR_SECRET }}
