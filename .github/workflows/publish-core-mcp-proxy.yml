name: Build and Push Core MCP Proxy

on:
  push:
    branches: [ "main" ]
    paths:
      - "core_mcp_proxy/**"
      - ".github/workflows/publish-core-mcp-proxy.yml"
      - ".github/workflows/build-multiarch-image.yml"
      - ".github/scripts/check-container.sh"
  pull_request:
    branches: [ "main" ]
    paths:
      - "core_mcp_proxy/**"
      - ".github/workflows/publish-core-mcp-proxy.yml"
      - ".github/workflows/build-multiarch-image.yml"
      - ".github/scripts/check-container.sh"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    uses: ./.github/workflows/build-multiarch-image.yml
    with:
      image: core-mcp-proxy
      context: ./core_mcp_proxy
      node-checks: npm run check
    secrets:
      DEPLOY_GHCR_SECRET: ${{ secrets.DEPLOY_GHCR_SECRET }}
