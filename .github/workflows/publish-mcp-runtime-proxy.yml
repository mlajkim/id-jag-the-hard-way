name: Build and Push MCP Runtime Proxy

on:
  push:
    branches: [ "main" ]
    paths:
      - "components/mcp-runtime-proxy/**"
      - ".github/workflows/publish-mcp-runtime-proxy.yml"
      - ".github/workflows/build-multiarch-image.yml"
      - ".github/scripts/check-container.sh"
  pull_request:
    branches: [ "main" ]
    paths:
      - "components/mcp-runtime-proxy/**"
      - ".github/workflows/publish-mcp-runtime-proxy.yml"
      - ".github/workflows/build-multiarch-image.yml"
      - ".github/scripts/check-container.sh"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    uses: ./.github/workflows/build-multiarch-image.yml
    with:
      image: mcp-runtime-proxy
      context: ./components/mcp-runtime-proxy
      node-checks: npm run check && npm test
    secrets:
      DEPLOY_GHCR_SECRET: ${{ secrets.DEPLOY_GHCR_SECRET }}
