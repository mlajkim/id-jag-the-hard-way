name: Build and Push MCP Gateway

on:
  push:
    branches: ["main"]
    paths:
      - "components/mcp-gateway/**"
      - ".github/workflows/publish-mcp-gateway.yml"
      - ".github/workflows/build-multiarch-image.yml"
      - ".github/scripts/check-container.sh"
  pull_request:
    branches: ["main"]
    paths:
      - "components/mcp-gateway/**"
      - ".github/workflows/publish-mcp-gateway.yml"
      - ".github/workflows/build-multiarch-image.yml"
      - ".github/scripts/check-container.sh"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    uses: ./.github/workflows/build-multiarch-image.yml
    with:
      image: mcp-gateway
      context: ./components/mcp-gateway
      node-checks: npm ci --no-audit --no-fund && npm run check && npm test
    secrets:
      DEPLOY_GHCR_SECRET: ${{ secrets.DEPLOY_GHCR_SECRET }}
