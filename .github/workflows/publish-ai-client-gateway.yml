name: Build and Push AI Client Gateway

on:
  push:
    branches: [ "main" ]
    paths:
      - "components/ai_client_gateway/**"
      - ".github/workflows/publish-ai-client-gateway.yml"
      - ".github/workflows/build-multiarch-image.yml"
      - ".github/scripts/check-container.sh"
  pull_request:
    branches: [ "main" ]
    paths:
      - "components/ai_client_gateway/**"
      - ".github/workflows/publish-ai-client-gateway.yml"
      - ".github/workflows/build-multiarch-image.yml"
      - ".github/scripts/check-container.sh"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    uses: ./.github/workflows/build-multiarch-image.yml
    with:
      image: ai-client-gateway
      context: ./components/ai_client_gateway
      node-checks: npm install --no-audit --no-fund && npm test
    secrets:
      DEPLOY_GHCR_SECRET: ${{ secrets.DEPLOY_GHCR_SECRET }}
