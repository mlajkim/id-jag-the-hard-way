name: Build and Push ID-JAG UI

on:
  push:
    branches: [ "main" ]
    paths:
      - "ui/**"
      - ".github/workflows/publish-idjag-ui.yml"
      - ".github/workflows/build-multiarch-image.yml"
      - ".github/scripts/check-container.sh"
  pull_request:
    branches: [ "main" ]
    paths:
      - "ui/**"
      - ".github/workflows/publish-idjag-ui.yml"
      - ".github/workflows/build-multiarch-image.yml"
      - ".github/scripts/check-container.sh"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    uses: ./.github/workflows/build-multiarch-image.yml
    with:
      image: idjag-ui
      context: ./ui
    secrets:
      DEPLOY_GHCR_SECRET: ${{ secrets.DEPLOY_GHCR_SECRET }}
