# This workflow packages the standalone provider JAR in an OCI image and
# publishes it to GHCR. Loading the JAR into ZTS remains a separate, deferred
# integration step.

name: Build and Push LocalWorkloadInstanceProvider JAR file

on:
  push:
    branches: ["main"]
    paths:
      - "components/local_workload_instance_provider/**"
      - ".github/workflows/publish-local-workload-instance-provider.yml"
      - ".github/workflows/build-multiarch-image.yml"
      - ".github/scripts/check-container.sh"

  pull_request:
    branches: ["main"]
    paths:
      - "components/local_workload_instance_provider/**"
      - ".github/workflows/publish-local-workload-instance-provider.yml"
      - ".github/workflows/build-multiarch-image.yml"
      - ".github/scripts/check-container.sh"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    uses: ./.github/workflows/build-multiarch-image.yml
    with:
      image: local-workload-instance-provider
      context: ./components/local_workload_instance_provider
      java-build: |
        make build
    secrets:
      DEPLOY_GHCR_SECRET: ${{ secrets.DEPLOY_GHCR_SECRET }}
