name: Build and Push Authorization Proxy for MCP Server

on:
  push:
    branches: [ "main" ]
    paths:
      - "components/api_server/authorization_proxy/**"
      - ".github/workflows/publish-mcp-authorization-proxy.yml"
      - ".github/workflows/build-multiarch-image.yml"
      - ".github/scripts/check-container.sh"
  pull_request:
    branches: [ "main" ]
    paths:
      - "components/api_server/authorization_proxy/**"
      - ".github/workflows/publish-mcp-authorization-proxy.yml"
      - ".github/workflows/build-multiarch-image.yml"
      - ".github/scripts/check-container.sh"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    uses: ./.github/workflows/build-multiarch-image.yml
    with:
      image: mcp-authorization-proxy
      context: ./components/api_server/authorization_proxy
      java-build: |
        mvn -B test
    secrets:
      DEPLOY_GHCR_SECRET: ${{ secrets.DEPLOY_GHCR_SECRET }}
