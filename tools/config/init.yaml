# Athenz permission model for the ID-JAG demo.
# Edit this file to change services, roles, members, and policies.
# Apply with: ./tools/setup-permissions.sh tools/config/init.yaml

domain: api

# Service identities in this domain
services:
  - name: api-mcp
    key_version: v1
    local_keys_dir: ./keys
    k8s:
      ns: mcp
      deployment: mcp
      secret:
        name: api-mcp-cert
        files:
          cert:
            k8s_name: api-mcp.crt
            local_name: api-mcp.crt
          key:
            k8s_name: api-mcp.key
            local_name: api-mcp.key
          ca:
            k8s_name: ca.crt
            import_from: ./athenz_dist/certs/ca.cert.pem

roles:
  # docs-getter: human user => GET /docs on the API server
  - name: docs-getter
    members:
      - human.idjag-learner
    policies:
      - allow: get
        on: docs

  # docs-poster: human user => POST /docs on the API server
  - name: docs-poster
    members:
      - human.idjag-learner
    policies:
      - allow: post
        on: docs

  # docs-deleter: human user => DELETE /docs on the API server
  - name: docs-deleter
    members:
      - human.idjag-learner
    policies:
      - allow: delete
        on: docs

  # mcp-accessor: human user => access the MCP auth proxy
  - name: mcp-accessor
    members:
      - human.idjag-learner
    policies:
      - allow: access
        on: mcp

  # docs-getter-jag-exchanger: AI agents => JAG exchange into docs-getter on the user's behalf
  - name: docs-getter-jag-exchanger
    members:
      - human.idjag-learner.claude
      - human.idjag-learner.codex
      - ai.open-webui
      - mcp-hub.mcp-gateway
    policies:
      - allow: zts.jag_exchange
        on: role.docs-getter

  # mcp-accessor-jag-exchanger: AI agents and MCP Hub => JAG exchange into mcp-accessor on the user's behalf
  - name: mcp-accessor-jag-exchanger
    members:
      - human.idjag-learner.claude
      - human.idjag-learner.codex
      - ai.open-webui
      - mcp-hub.mcp-gateway
    policies:
      - allow: zts.jag_exchange
        on: role.mcp-accessor

  # to-api-exchanger: MCP server => exchange inbound tokens issued for the api domain
  - name: to-api-exchanger
    members:
      - api.api-mcp
    policies:
      - allow: zts.token_source_exchange
        on: api

  # docs-getter-exchanger: MCP server => exchange into the docs-getter role before calling the API server
  - name: docs-getter-exchanger
    members:
      - api.api-mcp
    policies:
      - allow: zts.token_target_exchange
        on: api:role.docs-getter
